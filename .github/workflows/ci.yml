name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: actions/setup-node@v4
        with:
          node-version: '22'


      - uses: dtolnay/rust-toolchain@stable

      - name: Install code-index
        run: |
          mkdir -p /home/osso/Repos
          git clone --depth 1 https://github.com/Osso/ast-outline /home/osso/Repos/ast-outline
          cargo install --git https://github.com/Osso/code-index --locked

      - name: Run unit tests
        run: ./run-tests.sh unit
